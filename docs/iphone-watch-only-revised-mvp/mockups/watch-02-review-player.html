<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>watch-02 · Review player — Voxglass Watch</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="caption"><b>watch-02 · Review player</b>Ships today (<code>WatchReviewPlayerView</code>). Three decisions, one tap each. Every decision is an append-only event, idempotent by id.</div>

<div class="watch">
  <div class="status"><span>9:41</span><span>▰</span></div>
  <div class="nav"><span class="back">‹</span><span class="title">3 of 18</span></div>
  <div class="content">

    <div class="card tight" id="watch.paragraph">
      <div class="row between"><small class="warn-text">¶ 1188 · Ch 3</small><span class="chip">0:16</span></div>
      <p style="margin-top:6px;color:var(--ink)">It was, I reflected, a doubtful compliment.</p>
    </div>

    <div class="wave" style="height:26px"></div>

    <div class="transport">
      <button class="tbtn" id="watch.skipBack">−15</button>
      <button class="recbtn" style="background:var(--brass);border-color:rgba(227,164,75,.35);color:#21170B" id="watch.playPause">▶</button>
      <button class="tbtn" id="watch.skipForward">+15</button>
    </div>

    <div class="btn-row" style="margin-top:10px">
      <button class="btn" id="watch.pickup">↻</button>
      <button class="btn" id="watch.flag">⚑</button>
      <button class="btn primary" id="watch.approve">✓</button>
    </div>

    <button class="btn" style="margin-top:8px" id="watch.addNote">🎤 Note</button>

    <div class="card tight" style="margin-top:10px">
      <div class="row between"><small>Next</small><small class="muted">¶ 1206</small></div>
    </div>
  </div>
</div>

<script src="mockup.js"></script>
</body>
</html>
