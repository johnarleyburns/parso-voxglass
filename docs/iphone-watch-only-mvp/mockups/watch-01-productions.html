<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch Productions - Voxglass Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="watch">
    <div class="status"><span>9:41</span><span>100%</span></div>
    <div class="nav centered"><h1>Productions</h1><span></span></div>
    <div class="content">
      <div class="card">
        <div class="row"><div class="cover">SP</div><div class="grow"><h3>Secret Passage</h3><p class="muted">42 review items</p></div></div>
      </div>
      <div class="card">
        <div class="row"><div class="cover alt">W</div><div class="grow"><h3>Wilderness</h3><p class="muted">Recording remote ready</p></div></div>
      </div>
      <button class="primary full">Open Review</button>
      <button class="full">Start Remote</button>
    </div>
  </div>
</body>
</html>
