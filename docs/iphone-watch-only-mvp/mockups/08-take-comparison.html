<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Take Comparison - Voxglass Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone dark">
    <div class="status"><span>9:41</span><span>USB-C Mic 71%</span></div>
    <div class="nav centered"><span class="back">Record</span><h1>Compare Takes</h1><span class="action">Done</span></div>
    <div class="content compact">
      <div class="script-text">"The truth of the matter is," I said, "that I have been considerably puzzled by one or two points."</div>
      <div class="segmented"><span class="active">A/B</span><span>Context</span><span>Notes</span></div>
      <div class="card">
        <div class="row between"><h3>Take 2</h3><span class="chip green">Selected</span></div>
        <div class="wave"></div>
        <div class="kv">
          <div><span>Duration</span><b>8.7 s</b></div>
          <div><span>Peak</span><b>-3.1 dBFS</b></div>
          <div><span>Noise</span><b>-61 dBFS</b></div>
        </div>
        <button class="primary full">Play Take A</button>
      </div>
      <div class="card">
        <div class="row between"><h3>Take 3</h3><span class="chip">Alternate</span></div>
        <div class="wave"></div>
        <div class="kv">
          <div><span>Duration</span><b>9.4 s</b></div>
          <div><span>Peak</span><b>-4.8 dBFS</b></div>
          <div><span>Noise</span><b>-62 dBFS</b></div>
        </div>
        <button class="full">Play Take B</button>
      </div>
      <div class="button-stack">
        <button class="primary">Keep Take 2</button>
        <button>Use Take 3</button>
      </div>
    </div>
  </div>
</body>
</html>
