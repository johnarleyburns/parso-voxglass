<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch Dictation - Voxglass Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="watch">
    <div class="status"><span>9:41</span><span>94%</span></div>
    <div class="nav centered"><span class="back">Back</span><h1>Note</h1><span></span></div>
    <div class="content">
      <div class="card">
        <h3>Retake reason</h3>
        <div class="chips"><span class="chip yellow">Diction</span><span class="chip">Pacing</span></div>
        <p>"Pause before puzzled, less clipped consonant."</p>
      </div>
      <div class="grid2">
        <button class="primary">Save</button>
        <button>Redo</button>
      </div>
      <div class="card">
        <p class="muted">Queued to iPhone. Applied to Ch6 P37 when reachable.</p>
      </div>
    </div>
  </div>
</body>
</html>
