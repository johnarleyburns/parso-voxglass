<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metadata & Rights - Voxglass Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone">
    <div class="status"><span>9:41</span><span>Wi-Fi 64%</span></div>
    <div class="nav centered"><span class="back">Dashboard</span><h1>Metadata</h1><span class="action">Done</span></div>
    <div class="content compact">
      <div class="card">
        <div class="cover big">SP</div>
        <button class="full">Replace Artwork</button>
      </div>
      <div class="card">
        <div class="field"><label>Retail title</label><input value="The Secret Passage"></div>
        <div class="grid2">
          <div class="field"><label>Author</label><input value="M. R. Lyle"></div>
          <div class="field"><label>Narrator</label><input value="A. Reyes"></div>
        </div>
        <div class="field"><label>Publisher</label><input value="Parso Press"></div>
      </div>
      <h2 class="section-title">Rights</h2>
      <div class="card">
        <div class="list-row"><span class="status-dot"></span><div class="grow"><b>Audio rights</b><br><small>Worldwide exclusive audiobook rights.</small></div></div>
        <div class="list-row"><span class="status-dot"></span><div class="grow"><b>Source rights</b><br><small>Author-owned text.</small></div></div>
        <div class="list-row"><span class="status-dot warn"></span><div class="grow"><b>Cover rights</b><br><small>License document not attached.</small></div></div>
      </div>
      <h2 class="section-title">Retail IDs</h2>
      <div class="card">
        <div class="field"><label>ISBN</label><input value="978-1-23456-789-0"></div>
        <div class="field"><label>Copyright</label><input value="Copyright 2026 Parso Press"></div>
      </div>
    </div>
  </div>
</body>
</html>
