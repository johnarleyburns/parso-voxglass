<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch Recording Remote - Voxglass Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="watch">
    <div class="status"><span>9:41</span><span>95%</span></div>
    <div class="nav centered"><span class="back">Back</span><h1>Remote</h1><span></span></div>
    <div class="content">
      <div class="card">
        <h3>Ch6 P37</h3>
        <p class="muted">iPhone recording route is retail-ready.</p>
        <div class="meter"><i style="width:61%"></i></div>
      </div>
      <div class="transport"><button>Prev</button><button class="round record">Rec</button><button>Next</button></div>
      <div class="grid2">
        <button class="primary">Accept</button>
        <button>Flag</button>
      </div>
      <p class="muted">Watch controls do not store master audio. The iPhone remains the recorder.</p>
    </div>
  </div>
</body>
</html>
