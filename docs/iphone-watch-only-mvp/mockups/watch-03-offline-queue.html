<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch Offline Queue - Voxglass Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="watch">
    <div class="status"><span>9:41</span><span>96%</span></div>
    <div class="nav centered"><span class="back">Back</span><h1>Offline</h1><span></span></div>
    <div class="content">
      <div class="card">
        <div class="row between"><span>Review queue</span><b>18</b></div>
        <div class="progress"><i style="width:100%"></i></div>
        <p class="muted">22 MB on Watch. Synced through iPhone.</p>
      </div>
      <div class="card">
        <div class="list-row"><b>Secret Passage</b><span class="chip green">Ready</span></div>
        <div class="list-row"><b>Wilderness</b><span class="chip yellow">5 left</span></div>
      </div>
      <button class="primary full">Start Offline</button>
      <button class="full">Remove Queue</button>
    </div>
  </div>
</body>
</html>
