<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch Review Player - Voxglass Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="watch">
    <div class="status"><span>9:41</span><span>98%</span></div>
    <div class="nav centered"><span class="back">Back</span><h1>Ch6 P37</h1><span></span></div>
    <div class="content">
      <div class="card">
        <h3>Review flagged take</h3>
        <p>"The truth of the matter is..."</p>
        <div class="wave"></div>
        <div class="transport"><button>5s</button><button class="round primary">Play</button><button>Next</button></div>
      </div>
      <div class="grid3">
        <button class="primary">OK</button>
        <button>Redo</button>
        <button>Note</button>
      </div>
    </div>
  </div>
</body>
</html>
