<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recording Workspace - Voxglass Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone dark">
    <div class="status"><span>9:41</span><span>USB-C Mic 78%</span></div>
    <div class="nav centered"><span class="back">Chapter 6</span><h1>Record 37/84</h1><span class="action">Setup</span></div>
    <div class="content compact">
      <div class="chips"><span class="chip green">Retail-ready route</span><span class="chip">48 kHz 24-bit mono</span></div>
      <div class="teleprompter">"The truth of the matter is," I said, "that I have been considerably puzzled by one or two points."</div>
      <div class="wave tall"></div>
      <div class="transport">
        <button>Prev</button>
        <button class="round record">Rec</button>
        <button>Next</button>
      </div>
      <div class="card">
        <div class="row between"><span>Input peak</span><b>-14 dBFS</b></div>
        <div class="meter"><i style="width:64%"></i></div>
        <div class="row between"><small>Noise estimate -61 dBFS</small><small>No clipping</small></div>
      </div>
      <h2 class="section-title">Takes</h2>
      <div class="card">
        <div class="list-row"><b>Take 1</b><span class="chip red">clipped</span></div>
        <div class="list-row"><b>Take 2</b><span class="chip green">selected</span></div>
        <div class="list-row"><b>Take 3</b><span class="chip">alternate</span></div>
      </div>
      <div class="button-stack">
        <button class="primary">Accept and Next Paragraph</button>
        <button>Flag for Review</button>
      </div>
    </div>
  </div>
</body>
</html>
