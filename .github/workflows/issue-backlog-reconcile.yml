name: Claude Issue Controller
run-name: Reconcile one repository-local issue intake
on:
  issues:
    # Every new or reopened issue enters the controller queue automatically;
    # labels remain available for prioritization and explicit retries.
    types: [opened, reopened, labeled, closed]
  workflow_run:
    workflows: ["iOS Build & TestFlight", "iOS"]
    types: [completed]
  schedule:
    # Recovery only: GitHub cron may be delayed or dropped.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read
concurrency:
  group: claude-issue-controller
  cancel-in-progress: false
jobs:
  reconcile:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.issue.user.login == 'johnarleyburns' && (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'closed' || github.event.label.name == 'ai-ready' || github.event.label.name == 'retry-ai' || github.event.label.name == 'priority-high' || github.event.label.name == 'qa-failed')) ||
      (github.event_name == 'workflow_run' && vars.CLAUDE_PIPELINE_AUTO_ENABLED == 'true') ||
      (github.event_name == 'schedule' && vars.CLAUDE_PIPELINE_AUTO_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.CLAUDE_WORKFLOW_TOKEN }}
      CLAUDE_PIPELINE_AUTO_ENABLED: ${{ vars.CLAUDE_PIPELINE_AUTO_ENABLED }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - run: |
          test -n "$GH_TOKEN" || { echo '::error::CLAUDE_WORKFLOW_TOKEN is not configured'; exit 1; }
          # A human QA failure supersedes a completed implementation. Reopen
          # before admission so the normal repair path can create a follow-up
          # implementation PR instead of silently skipping the closed issue.
          if [[ "${{ github.event_name }}" == issues && "${{ github.event.action }}" == labeled && "${{ github.event.label.name }}" == qa-failed && "${{ github.event.issue.state }}" == closed ]]; then
            gh issue reopen "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY"
          fi
          bash .github/scripts/admit-one-stranded-issue.sh
