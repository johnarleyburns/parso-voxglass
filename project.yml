name: Voxglass
options:
  bundleIdPrefix: guru.parso
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  VoxglassCore:
    path: .
settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "52"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
targets:
  Voxglass:
    type: application
    platform: iOS
    sources:
      - path: Voxglass
        excludes:
          - Resources/Info.plist
          - Resources/Voxglass.entitlements
          - Core
      - path: Voxglass/Resources/Artwork
        type: folder
      - path: Voxglass/Resources/CarPlayCues
        type: folder
    dependencies:
      - package: VoxglassCore
      - target: VoxglassWatch
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CarPlay.framework
      - sdk: MediaPlayer.framework
      - sdk: WatchConnectivity.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: libsqlite3.tbd
    info:
      path: Voxglass/Resources/Info.plist
      properties:
        CFBundleDisplayName: Voxglass
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UTImportedTypeDeclarations:
          - UTTypeConformsTo:
              - public.json
            UTTypeDescription: Voxglass Backup (legacy)
            UTTypeIdentifier: guru.parso.voxglass.backup
            UTTypeTagSpecification:
              public.filename-extension:
                - voxglassbackup
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneClassName: CPTemplateApplicationScene
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UIBackgroundModes:
          - audio
          - remote-notification
        UILaunchScreen:
          UIColorName: LaunchScreenBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: guru.parso.voxglass
        PRODUCT_NAME: Voxglass
        INFOPLIST_FILE: Voxglass/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Voxglass/Resources/Voxglass.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Parso Voxglass App Store"
          CODE_SIGN_ENTITLEMENTS: Voxglass/Resources/Voxglass-release.entitlements
  VoxglassWatch:
    type: application
    platform: watchOS
    sources:
      - path: VoxglassWatch
        excludes:
          - Resources/Info.plist
          - Resources/VoxglassWatch.entitlements
    dependencies:
      - package: VoxglassCore
      - sdk: AVFoundation.framework
      - sdk: WatchConnectivity.framework
      - sdk: libsqlite3.tbd
    info:
      path: VoxglassWatch/Resources/Info.plist
      properties:
        CFBundleDisplayName: Voxglass
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        WKCompanionAppBundleIdentifier: guru.parso.voxglass
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: guru.parso.voxglass.watchkitapp
        PRODUCT_NAME: VoxglassWatch
        INFOPLIST_FILE: VoxglassWatch/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: VoxglassWatch/Resources/VoxglassWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        CFBundleIconName: AppIcon
        MARKETING_VERSION: "$(MARKETING_VERSION)"
        CURRENT_PROJECT_VERSION: "$(CURRENT_PROJECT_VERSION)"
        INFOPLIST_KEY_WKApplication: true
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: true
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: guru.parso.voxglass
        INFOPLIST_KEY_CFBundleIconName: AppIcon
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Parso Voxglass Watch App Store"
          CODE_SIGN_ENTITLEMENTS: VoxglassWatch/Resources/VoxglassWatch-release.entitlements
  VoxglassStudio:
    type: application
    platform: macOS
    sources:
      - path: VoxglassStudio
        excludes:
          - Resources/Info.plist
          - Resources/VoxglassStudio.entitlements
      - path: Voxglass/Core/Encoders
        buildPhase: sources
    dependencies:
      - package: VoxglassCore
      # LAME and libFLAC are *static* framework slices (S8). Link them directly
      # with embed:false — SwiftPM's product dependency auto-embeds framework
      # slices as dynamic, which fails because a static slice has no Info.plist
      # ("Framework ... did not contain an Info.plist").
      - framework: Tools/encoders/Vendored/Lame.xcframework
        embed: false
      - framework: Tools/encoders/Vendored/FLAC.xcframework
        embed: false
      - sdk: AVFoundation.framework
      - sdk: StoreKit.framework
      - sdk: libsqlite3.tbd
    info:
      path: VoxglassStudio/Resources/Info.plist
      properties:
        CFBundleDisplayName: Voxglass Studio
        CFBundleName: VoxglassStudio
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        NSMicrophoneUsageDescription: "Voxglass records your narration for the audiobook you are producing. Audio stays on your Mac unless you choose to preview it on your devices."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: guru.parso.voxglass.studio
        PRODUCT_NAME: VoxglassStudio
        INFOPLIST_FILE: VoxglassStudio/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: VoxglassStudio/Resources/VoxglassStudio.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Parso Voxglass Studio App Store"
          CODE_SIGN_ENTITLEMENTS: VoxglassStudio/Resources/VoxglassStudio-release.entitlements
  VoxglassUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - VoxglassUITests
    dependencies:
      - target: Voxglass
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: guru.parso.voxglass.uitests
        TEST_TARGET_NAME: Voxglass
        CODE_SIGNING_ALLOWED: NO
  VoxglassCarPlaySmokeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - VoxglassCarPlaySmokeTests
    dependencies:
      - target: Voxglass
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: guru.parso.voxglass.carplaysmoke
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Voxglass.app/Voxglass"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGNING_ALLOWED: NO
  VoxglassWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - VoxglassWatchUITests
    dependencies:
      - target: VoxglassWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: guru.parso.voxglass.watchkitapp.uitests
        TEST_TARGET_NAME: VoxglassWatch
        CODE_SIGNING_ALLOWED: NO
  VoxglassStudioUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - VoxglassStudioUITests
    dependencies:
      - target: VoxglassStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: guru.parso.voxglass.studio.uitests
        TEST_TARGET_NAME: VoxglassStudio
        CODE_SIGNING_ALLOWED: NO
schemes:
  Voxglass:
    build:
      targets:
        Voxglass: all
    test:
      gatherCoverageData: true
      targets:
        - VoxglassUITests
        - VoxglassCarPlaySmokeTests
  VoxglassWatch:
    build:
      targets:
        VoxglassWatch: all
    test:
      gatherCoverageData: true
      environmentVariables:
        VOXGLASS_WATCH_SMOKE_ALICE: "1"
      targets:
        - VoxglassWatchUITests
  VoxglassStudio:
    build:
      targets:
        VoxglassStudio: all
    test:
      gatherCoverageData: true
      targets:
        - VoxglassStudioUITests
    storeKitConfiguration: VoxglassStudio/Resources/VoxglassStudio.storekit
