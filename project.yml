name: Voxglass
options:
  bundleIdPrefix: guru.parso
  deploymentTarget:
    iOS: "26.0"
    macOS: "14.0"
    watchOS: "10.0"
  createIntermediateGroups: true
packages:
  VoxglassCore:
    path: .
  # Audio-engine unification (parso-audio-engine/docs/UNIFICATION_PLAN.md).
  # Pin the published engine release so local and CI builds use the same
  # immutable revision.
  ParsoAudioEngine:
    url: https://github.com/johnarleyburns/parso-audio-engine.git
    exactVersion: 1.2.2
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.20
settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "52"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
targets:
  Voxglass:
    type: application
    platform: iOS
    sources:
      - path: Voxglass
        excludes:
          - Resources/Info.plist
          - Resources/Voxglass.entitlements
          - Resources/VoxglassNarration.storekit
          - Core
      - path: Voxglass/Resources/Artwork
        type: folder
      - path: Voxglass/Resources/CarPlayCues
        type: folder
    resources:
      - path: Voxglass/Resources/PrivacyInfo.xcprivacy
      - path: Voxglass/Resources/Localizable.xcstrings
    dependencies:
      - package: VoxglassCore
        product: VoxglassCore
      # Production preview on the phone shares the encoder pipeline. MP3 (Glint)
      # and FLAC (libFLAC) decode/encode now come from parso-audio-engine's
      # vendored source via VoxglassEncoders — no binary xcframeworks (§16.3, C-3).
      - package: VoxglassCore
        product: VoxglassEncoders
      - package: ParsoAudioEngine
        product: ParsoAudioStreaming
      - package: ParsoAudioEngine
        product: ParsoAudioPlayback
      - package: VoxglassCore
        product: VoxglassWatchProtocol
      - package: VoxglassCore
        product: VoxglassWatchCore
      - package: ZIPFoundation
        product: ZIPFoundation
      - target: VoxglassWatch
        platformFilter: iOS
      - target: VoxglassWidgets
        platformFilter: iOS
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CarPlay.framework
      - sdk: MediaPlayer.framework
      - sdk: WatchConnectivity.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: libsqlite3.tbd
    info:
      path: Voxglass/Resources/Info.plist
      properties:
        CFBundleDisplayName: Voxglass
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Voxglass records your narration for the audiobook you are producing. Your recordings stay on this device unless you choose to share or preview them."
        UTImportedTypeDeclarations:
          - UTTypeConformsTo:
              - public.json
            UTTypeDescription: Voxglass Backup (legacy)
            UTTypeIdentifier: guru.parso.voxglass.backup
            UTTypeTagSpecification:
              public.filename-extension:
                - voxglassbackup
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneClassName: CPTemplateApplicationScene
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UIBackgroundModes:
          - audio
          - remote-notification
        UILaunchScreen:
          UIColorName: LaunchScreenBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: guru.parso.voxglass
        PRODUCT_NAME: Voxglass
        SUPPORTS_MACCATALYST: YES
        INFOPLIST_FILE: Voxglass/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Voxglass/Resources/Voxglass.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Parso Voxglass App Store"
          CODE_SIGN_ENTITLEMENTS: Voxglass/Resources/Voxglass-release.entitlements
  VoxglassWidgets:
    type: app-extension
    platform: iOS
    sources:
      - VoxglassWidgets
    dependencies:
      - package: VoxglassCore
        product: VoxglassCore
    info:
      path: VoxglassWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: guru.parso.voxglass.widgets
        PRODUCT_NAME: VoxglassWidgets
        CODE_SIGN_ENTITLEMENTS: VoxglassWidgets/VoxglassWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Parso Voxglass Widgets App Store"
  VoxglassWatch:
    type: application
    platform: watchOS
    preBuildScripts:
      - name: Validate Watch app icon
        script: "bash \"${SRCROOT}/scripts/check_watch_app_icon.sh\""
        inputFiles:
          - "$(SRCROOT)/scripts/check_watch_app_icon.sh"
          - "$(SRCROOT)/VoxglassWatch/Resources/Assets.xcassets/AppIcon.appiconset/Contents.json"
          - "$(SRCROOT)/VoxglassWatch/Resources/Assets.xcassets/AppIcon.appiconset/icon_1024.png"
          - "$(SRCROOT)/VoxglassWatch/Resources/Assets.xcassets/AppIcon.appiconset/icon_1024-runtime.png"
        basedOnDependencyAnalysis: false
    sources:
      - path: VoxglassWatch
        excludes:
          - Resources/Info.plist
          - Resources/VoxglassWatch.entitlements
    resources:
      - path: VoxglassWatch/Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: VoxglassCore
        product: VoxglassWatchProtocol
      - package: VoxglassCore
        product: VoxglassWatchCore
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework
      - sdk: WatchConnectivity.framework
      - sdk: libsqlite3.tbd
    info:
      path: VoxglassWatch/Resources/Info.plist
      properties:
        CFBundleDisplayName: Voxglass
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        WKCompanionAppBundleIdentifier: guru.parso.voxglass
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: guru.parso.voxglass.watchkitapp
        PRODUCT_NAME: VoxglassWatch
        INFOPLIST_FILE: VoxglassWatch/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: VoxglassWatch/Resources/VoxglassWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        CFBundleIconName: AppIcon
        MARKETING_VERSION: "$(MARKETING_VERSION)"
        CURRENT_PROJECT_VERSION: "$(CURRENT_PROJECT_VERSION)"
        INFOPLIST_KEY_WKApplication: true
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: true
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: guru.parso.voxglass
        INFOPLIST_KEY_CFBundleIconName: AppIcon
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Parso Voxglass Watch App Store"
          CODE_SIGN_ENTITLEMENTS: VoxglassWatch/Resources/VoxglassWatch-release.entitlements
  VoxglassUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - VoxglassUITests
    dependencies:
      - target: Voxglass
      - package: VoxglassCore
        product: VoxglassCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: guru.parso.voxglass.uitests
        TEST_TARGET_NAME: Voxglass
        CODE_SIGNING_ALLOWED: NO
  VoxglassCarPlaySmokeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - VoxglassCarPlaySmokeTests
    dependencies:
      - target: Voxglass
      - package: ZIPFoundation
        product: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: guru.parso.voxglass.carplaysmoke
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Voxglass.app/Voxglass"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGNING_ALLOWED: NO
  VoxglassWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - VoxglassWatchUITests
    dependencies:
      - target: VoxglassWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: guru.parso.voxglass.watchkitapp.uitests
        TEST_TARGET_NAME: VoxglassWatch
        CODE_SIGNING_ALLOWED: NO
  VoxglassMac:
    type: application
    platform: macOS
    sources:
      - path: VoxglassMac
        excludes:
          - Resources/Info.plist
          - Resources/VoxglassMac.entitlements
          - Resources/VoxglassMac-release.entitlements
      - path: Voxglass/Features/Production/Discovery/NarrationProjectRepository.swift
      - path: Voxglass/Features/Production/AVChapterRenderer.swift
    resources:
      - path: Voxglass/Resources/Assets.xcassets
      - path: VoxglassMac/Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: VoxglassCore
        product: VoxglassCore
      - package: VoxglassCore
        product: VoxglassEncoders
      - package: ParsoAudioEngine
        product: ParsoAudioStreaming
      - package: ParsoAudioEngine
        product: ParsoAudioPlayback
      - package: ZIPFoundation
        product: ZIPFoundation
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CloudKit.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: libsqlite3.tbd
    info:
      path: VoxglassMac/Resources/Info.plist
      properties:
        CFBundleDisplayName: Voxglass
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Voxglass records your narration for the audiobook you are producing. Your recordings stay on this Mac unless you choose to sync or export them."
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.books
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: guru.parso.voxglass
        PRODUCT_NAME: Voxglass
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_FILE: VoxglassMac/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: VoxglassMac/Resources/VoxglassMac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Parso Voxglass Mac App Store"
          CODE_SIGN_ENTITLEMENTS: VoxglassMac/Resources/VoxglassMac-release.entitlements
  VoxglassMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - VoxglassMacTests
    dependencies:
      - target: VoxglassMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: guru.parso.voxglass.mactests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Voxglass.app/Contents/MacOS/Voxglass"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGNING_ALLOWED: NO
  VoxglassMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - VoxglassMacUITests
    dependencies:
      - target: VoxglassMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: guru.parso.voxglass.macuitests
        TEST_TARGET_NAME: VoxglassMac
        CODE_SIGNING_ALLOWED: NO
  VoxglassNarrationE2E:
    type: bundle.unit-test
    platform: iOS
    sources:
      - VoxglassNarrationE2E
    dependencies:
      - target: Voxglass
      - package: VoxglassCore
        product: VoxglassCore
      - package: VoxglassCore
        product: VoxglassEncoders
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: guru.parso.voxglass.narratione2e
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Voxglass.app/Voxglass"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGNING_ALLOWED: NO
schemes:
  Voxglass:
    build:
      targets:
        Voxglass: all
    test:
      gatherCoverageData: true
      commandLineArguments:
        -uiTestDisableCloudKit: true
      targets:
        - VoxglassUITests
        - VoxglassCarPlaySmokeTests
  VoxglassWatch:
    build:
      targets:
        VoxglassWatch: all
    test:
      gatherCoverageData: true
      environmentVariables:
        VOXGLASS_WATCH_SMOKE_ALICE: "1"
      targets:
        - VoxglassWatchUITests
  VoxglassNarrationE2E:
    build:
      targets:
        Voxglass: all
    test:
      gatherCoverageData: false
      targets:
        - VoxglassNarrationE2E
  VoxglassMac:
    build:
      targets:
        VoxglassMac: all
    test:
      gatherCoverageData: true
      targets:
        - VoxglassMacTests
